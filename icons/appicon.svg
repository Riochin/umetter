<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">  <defs>    <clipPath id="app-icon-clip">      <rect width="1024" height="1024" rx="224" />    </clipPath>    <linearGradient id="cute-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">      <stop offset="0%" stop-color="#E24A6D" /> <!-- 少しピンクみのある明るい赤 -->      <stop offset="100%" stop-color="#7B1C31" /> <!-- 深いえんじ色 -->    </linearGradient>    <filter id="cute-shadow" x="-20%" y="-20%" width="140%" height="140%">      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#4A0F1B" flood-opacity="0.4" />    </filter>    <!-- チークのグラデーション (中心がピンク、外が透明) -->    <radialGradient id="cheek-grad" cx="50%" cy="50%" r="50%">      <stop offset="0%" stop-color="#FF9CB5" stop-opacity="0.8" />      <stop offset="40%" stop-color="#FFB3C6" stop-opacity="0.4" />      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />    </radialGradient>  </defs>    <g clip-path="url(#app-icon-clip)">    <rect width="1024" height="1024" fill="url(#cute-bg-grad)" />        <g transform="translate(512, 520)" filter="url(#cute-shadow)">      <!-- 白い花びらベース -->      <g fill="#FFFFFF">        <circle cx="0" cy="-160" r="180" transform="rotate(0)" />        <circle cx="0" cy="-160" r="180" transform="rotate(72)" />        <circle cx="0" cy="-160" r="180" transform="rotate(144)" />        <circle cx="0" cy="-160" r="180" transform="rotate(216)" />        <circle cx="0" cy="-160" r="180" transform="rotate(288)" />        <circle cx="0" cy="0" r="130" />      </g>            <!-- 上からチークのグラデーションを被せる -->      <circle cx="0" cy="0" r="280" fill="url(#cheek-grad)" />      <!-- しべ (白から可愛い黄色 #FFC72C に変更) -->      <g fill="#FFC72C">        <circle cx="0" cy="-80" r="14" transform="rotate(0)" />        <circle cx="0" cy="-80" r="14" transform="rotate(72)" />        <circle cx="0" cy="-80" r="14" transform="rotate(144)" />        <circle cx="0" cy="-80" r="14" transform="rotate(216)" />        <circle cx="0" cy="-80" r="14" transform="rotate(288)" />      </g>            <!-- 中心 -->      <circle cx="0" cy="0" r="32" fill="#E24A6D" />      <!-- 中心の点も黄色にしたい場合は下の fill を #FFC72C にしてください -->      <circle cx="0" cy="0" r="14" fill="#FFFFFF" />    </g>  </g></svg>